        <div class="scores" id="dscores"></div>
        <div class="facts" id="dfacts"></div>
        <div class="overview">${esc(it.overview || 'Sin descripción en español.')}</div>
        <div class="where" id="where">Buscando dónde verla…</div>
        <div class="actions" id="actions"></div>
      </div>
    </div>
    <div class="more" id="dmore"></div>`;
  $('detail').scrollTop = 0;
  overlay.classList.add('on');

  const extra = type === 'movie' ? 'videos,credits,recommendations,similar,release_dates,external_ids' : 'videos,aggregate_credits,recommendations,similar,content_ratings,external_ids';
  const [p, d] = await Promise.all([
    providers(type, it.id),
    api(`${type}/${it.id}`, { append_to_response: extra, include_video_language: 'es,en,null' }).catch(() => null)
  ]);
  if (!overlay.classList.contains('on') || detailKey !== key) return;

  // Dónde verla
  const mine = p.mine.filter(s => PREMIUM.includes(s));
  $('where').innerHTML = mine.length
    ? 'Disponible en: ' + mine.map(s => SERVICES[s].name).join(', ')
    : `No está en ${svcList('ni')} en Argentina.` +
      (p.others.length ? `<small>Disponible en: ${esc(p.others.join(', '))}</small>` : '') +
      (p.rent.length ? `<small>Alquiler o compra: ${esc(p.rent.slice(0, 5).join(', '))}</small>` : '');

  // Tráiler: el oficial en español si existe; si no, en inglés
  let trailerKey = null;
  if (d && d.videos) {
    const vids = (d.videos.results || []).filter(v => v.site === 'YouTube' && (v.type === 'Trailer' || v.type === 'Teaser'));
    const best = vids.find(v => v.iso_639_1 === 'es' && v.type === 'Trailer') || vids.find(v => v.iso_639_1 === 'es')
              || vids.find(v => v.type === 'Trailer') || vids[0];
    if (best) trailerKey = best.key;
  }
  // Completa los datos del título con la ficha (por si se abrió desde un lugar con datos parciales)
  if (d) for (const f of ['title', 'name', 'poster_path', 'backdrop_path', 'overview', 'vote_average', 'vote_count', 'release_date', 'first_air_date', 'original_language']) if (d[f] != null && it[f] == null) it[f] = d[f];
  if (d && !it.genre_ids) it.genre_ids = (d.genres || []).map(g => g.id);
  detailCtx = { it, p, d, trailerKey };
  if (d && d.runtime) it.runtime = d.runtime;
  $('actions').innerHTML = actionButtons(it, p, trailerKey);
  if (!IS_TOUCH) $('actions').querySelector('.btn').focus({ preventScroll: true });
  // Cuando llegan los enlaces exactos, se redibujan los botones manteniendo el foco
  detailCtx.linksPromise = directLinks(it, d).catch(() => null);
  detailCtx.linksPromise.then(links => {
    if (!links || detailKey !== key || !detailCtx || detailCtx.it !== it) return;
    detailCtx.links = links;
    const kids = [...$('actions').children];
    const idx = kids.indexOf(document.activeElement);
    $('actions').innerHTML = actionButtons(it, p, trailerKey);
    if (idx >= 0 && $('actions').children[idx]) $('actions').children[idx].focus({ preventScroll: true });
  });
  if (!d) return;

  // Datos: duración / temporadas, edad, géneros, dirección o creadores
  const meta = [type === 'tv' ? 'Serie' : 'Película', year, rating];
  if (type === 'movie' && d.runtime) meta.push(fmtRuntime(d.runtime));
  if (type === 'tv' && d.number_of_seasons) meta.push(`${d.number_of_seasons} temporada${d.number_of_seasons > 1 ? 's' : ''} · ${d.number_of_episodes} episodios`);
  const cert = certOf(d, type);
  $('dmeta').innerHTML = meta.filter(Boolean).map(esc).join(' · ') + (cert ? ` · <span class="cert">${esc(cert)}</span>` : '');
  const facts = [];
  if (d.genres && d.genres.length) facts.push(`<b>Género:</b> ${esc(d.genres.map(g => g.name).join(', '))}`);
  if (type === 'movie' && d.credits) {
    const dir = (d.credits.crew || []).filter(c => c.job === 'Director').map(c => c.name);
    if (dir.length) facts.push(`<b>Dirección:</b> ${esc(dir.join(', '))}`);
  }
  if (type === 'tv' && d.created_by && d.created_by.length) facts.push(`<b>Creada por:</b> ${esc(d.created_by.map(c => c.name).join(', '))}`);
  if (type === 'tv' && d.status) facts.push(`<b>Estado:</b> ${d.status === 'Ended' ? 'Finalizada' : d.status === 'Canceled' ? 'Cancelada' : 'En emisión'}`);
  if (type === 'tv' && d.next_episode_to_air) {
    const n = d.next_episode_to_air;
    facts.push(`<b>Próximo episodio:</b> T${n.season_number} E${n.episode_number} · ${new Date(n.air_date + 'T12:00').toLocaleDateString(LANG, { weekday: 'long', day: 'numeric', month: 'long' })}`);
  }
  if (type === 'tv' && progress[it.id]) facts.push(`<span id="dprog">${progressLine(it.id)}</span>`);
  $('dfacts').innerHTML = facts.join('<br>');
  showScores(d, key);

  let more = '';
  // Temporadas y episodios (series)
  const seasons = type === 'tv' ? (d.seasons || []).filter(s => s.season_number > 0 && s.episode_count > 0) : [];
  if (seasons.length) {
    more += `<h4>Temporadas y episodios</h4><div class="wrap seasons">${seasons.map(s =>
      `<button class="chip focusable" data-season="${s.season_number}">Temporada ${s.season_number}<small> · ${s.episode_count} ep.</small></button>`).join('')}</div><div id="eps" class="eps"></div>`;
  }
  // Saga (películas que son parte de una colección)
  if (type === 'movie' && d.belongs_to_collection) more += '<div id="dsaga"><h4>🎬 Saga</h4><div class="msg" style="padding:1vh 0">Cargando la saga en orden…</div></div>';

  // Reparto con fotos: al elegir una persona se buscan sus títulos
  const cast = ((type === 'movie' ? d.credits && d.credits.cast : d.aggregate_credits && d.aggregate_credits.cast) || []).slice(0, 16);
  if (cast.length) {
    more += `<h4>Reparto</h4><div class="strip">${cast.map(c => {
      const role = c.character || (c.roles && c.roles[0] && c.roles[0].character) || '';
      const ph = c.profile_path ? `<img loading="lazy" src="${IMG}w185${c.profile_path}" alt="">` : '<div class="ph">👤</div>';
      return `<button class="person focusable" data-person="${esc(c.name)}">${ph}<div class="pn">${esc(c.name)}</div>${role ? `<div class="pc">${esc(role)}</div>` : ''}</button>`;
    }).join('')}</div>`;
  }
  more += '<div id="drecs"><h4>Si te gustó esto…</h4><div class="msg" style="padding:1vh 0">Buscando títulos parecidos en tus plataformas…</div></div>';
  $('dmore').innerHTML = more;
  if (seasons.length) loadSeason(it.id, (progress[it.id] && progress[it.id].s) || seasons[0].season_number);
  if (type === 'movie' && d.belongs_to_collection) loadSaga(d.belongs_to_collection, key);

  // "Si te gustó esto…": recomendados y parecidos, solo de tus plataformas
  const seenKeys = new Set();
  const pool = [...((d.recommendations || {}).results || []), ...((d.similar || {}).results || [])]
    .map(r => ({ ...r, _type: r.media_type || type }))
    .filter(r => /[a-záéíóúñü]/i.test(r.title || r.name || '')) // sin títulos en otros alfabetos
    .filter(r => { const k = typeOf(r) + '/' + r.id; if (k === key || seenKeys.has(k)) return false; seenKeys.add(k); return true; });
  const recs = notSeen(await onlyMine(pool)).slice(0, 20);
  if (!overlay.classList.contains('on') || detailKey !== key) return;
  $('drecs').innerHTML = recs.length
    ? `<h4>Si te gustó esto…</h4><div class="strip">${recs.map(r => cardHTML(r)).join('')}</div>`
    : '';
  fillBadges($('drecs'));
}

/* Puntajes de IMDb, Rotten Tomatoes y Metacritic (OMDb, opcional) */
async function omdb(imdbId) {
  const key = 'c:omdb:' + imdbId;
  const hit = cacheGet(key);
  if (hit) return hit.d;
  const r = await fetch(`https://www.omdbapi.com/?i=${imdbId}&apikey=${encodeURIComponent(omdbKey)}`).then(x => x.json());
  if (r.Response !== 'True') return null;
  const out = { ratings: r.Ratings || [], votes: r.imdbVotes };
  cacheSet(key, out, 24 * HOUR);
  return out;
}
async function showScores(d, key) {
  const box = $('dscores');
  const tmdb = d.vote_average ? `<span class="score tmdb">TMDB <b>${d.vote_average.toFixed(1)}</b><small>${d.vote_count} votos</small></span>` : '';
  box.innerHTML = tmdb;
  const imdbId = (d.external_ids || {}).imdb_id || d.imdb_id;
  if (!omdbKey || !imdbId) return;
  const o = await omdb(imdbId).catch(() => null);
  if (!o || detailKey !== key) return;
  const html = o.ratings.map(r => {
    const name = r.Source === 'Internet Movie Database' ? 'IMDb' : r.Source;
    const cls = name === 'IMDb' ? 'imdb' : name === 'Rotten Tomatoes' ? 'rt' : 'mc';
    const val = name === 'IMDb' ? r.Value.replace('/10', '') : name === 'Metacritic' ? r.Value.replace('/100', '') : r.Value;
    const icon = name === 'Rotten Tomatoes' ? (parseInt(val, 10) >= 60 ? '🍅 ' : '🤢 ') : '';
    return `<span class="score ${cls}">${name} <b>${icon}${esc(val)}</b>${name === 'IMDb' && o.votes ? `<small>${esc(o.votes)} votos</small>` : ''}</span>`;
  }).join('');
  box.innerHTML = html + tmdb;
}

// "▶ Ver en…" tocado antes de que llegue el enlace exacto: lo espera (hasta 4 s, así el navegador
// todavía lo cuenta como tu toque y deja abrir la app) y abre directo el título
async function openWhenReady(svc, btn) {
  loading.innerHTML = `Buscando el título en ${esc(SERVICES[svc].name)}…`;
  loading.classList.add('show');
  const links = await Promise.race([detailCtx.linksPromise, new Promise(r => setTimeout(() => r(null), 4000))]);
  go((links && links[svc]) || btn.dataset.go, SERVICES[svc].name);
}

function closeDetail() {
  if (!fromPop && navTag() === 'detail') { history.back(); return; }
  overlay.classList.remove('on');
  detailKey = null;
  if (returnFocus && document.body.contains(returnFocus)) returnFocus.focus({ preventScroll: true });
}
overlay.addEventListener('click', e => {
  const b = e.target.closest('.btn');
  const card = e.target.closest('.card');
  const person = e.target.closest('.person');
  const it = detailKey && items.get(detailKey);
  const season = e.target.closest('[data-season]');
  const ep = e.target.closest('.ep');
  if (b && b.dataset.svc && detailCtx && !detailCtx.links && detailCtx.linksPromise) openWhenReady(b.dataset.svc, b);
  else if (b && b.dataset.go) go(b.dataset.go, b.dataset.label, b.dataset.hint);
  else if (b && b.hasAttribute('data-list') && it) { toggleList(it); refreshActions(it, b); }
  else if (b && b.hasAttribute('data-seen') && it) { toggleSeen(it); refreshActions(it, b); }
  else if (b && b.dataset.like && it) { setLike(it, +b.dataset.like); refreshActions(it, b); }
  else if (b && b.hasAttribute('data-follow') && it) { toggleFollow(it, detailCtx && detailCtx.d); refreshActions(it, b); }
  else if (b && b.hasAttribute('data-share') && it) openWhatsApp(shareText(it, detailCtx && detailCtx.p));
  else if (b && b.hasAttribute('data-copy') && it) {
    copyText(shareText(it, detailCtx && detailCtx.p)).then(ok => { b.textContent = ok ? '✓ Copiado' : 'No se pudo copiar'; setTimeout(() => { b.textContent = '📋 Copiar'; }, 2500); });
  }
  else if (season && it) loadSeason(it.id, +season.dataset.season);
  else if (ep && it) {
    progress[it.id] = { s: +ep.dataset.s, e: +ep.dataset.ep, at: Date.now() };
    saveLists();
    loadSeason(it.id, +ep.dataset.s).then(() => {
      const again = document.querySelector(`.ep[data-ep="${ep.dataset.ep}"]`);
      if (again) again.focus({ preventScroll: true });
    });
    if ($('dprog')) $('dprog').innerHTML = progressLine(it.id);
    else $('dfacts').insertAdjacentHTML('beforeend', `<br><span id="dprog">${progressLine(it.id)}</span>`);
  }
  else if (card) openDetail(card.dataset.key);
  else if (person) {
    closeDetail();
    $('q').value = person.dataset.person;
    clearTimeout(searchTimer);
    runSearch();
  }
  else if ((b && b.hasAttribute('data-close')) || e.target === overlay) closeDetail();
});
// Redibuja los botones de la ficha conservando el foco en el mismo botón
async function refreshActions(it, btn) {
  const which = btn.hasAttribute('data-list') ? '[data-list]' : btn.hasAttribute('data-seen') ? '[data-seen]'
    : btn.dataset.like ? `[data-like="${btn.dataset.like}"]` : '[data-follow]';
  const p = detailCtx ? detailCtx.p : await providers(it.media_type, it.id);
  $('actions').innerHTML = actionButtons(it, p, detailCtx ? detailCtx.trailerKey : null);
  const again = $('actions').querySelector(which);
  if (again) again.focus({ preventScroll: true });
}

/* ================= Navegación espacial (teclado / mando) ================= */
function visibleFocusables() {
  const root = overlay.classList.contains('on') ? overlay : $(view);
  return [...root.querySelectorAll('.focusable')].filter(el => el.offsetParent !== null);
}
function moveFocus(dir) {
  const els = visibleFocusables();
  const cur = document.activeElement;
  if (!els.includes(cur)) { els[0] && els[0].focus(); return; }
  const r = cur.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  let best = null, bestScore = Infinity;
  for (const el of els) {
    if (el === cur) continue;
    const s = el.getBoundingClientRect();
    const dx = s.left + s.width / 2 - cx, dy = s.top + s.height / 2 - cy;
    let main, cross;
    if (dir === 'right') { if (dx <= 4) continue; main = dx; cross = Math.abs(dy); }
    if (dir === 'left')  { if (dx >= -4) continue; main = -dx; cross = Math.abs(dy); }
    if (dir === 'down')  { if (dy <= 4) continue; main = dy; cross = Math.abs(dx); }
    if (dir === 'up')    { if (dy >= -4) continue; main = -dy; cross = Math.abs(dx); }
    const score = (dir === 'left' || dir === 'right') ? main + cross * 4 : main * 3 + cross;
    if (score < bestScore) { bestScore = score; best = el; }
  }
  if (best) {
    best.focus({ preventScroll: true });
    best.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
  } else if (dir === 'up') {
    content.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

function back() {
  if (overlay.classList.contains('on')) closeDetail();
  else if (view === 'explore') show('menu');
}

const DIRS = { ArrowRight: 'right', ArrowLeft: 'left', ArrowDown: 'down', ArrowUp: 'up' };
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.altKey || e.metaKey) return;
  if (view === 'menu' && !overlay.classList.contains('on')) { if (menuKey(e)) e.preventDefault(); return; }

  const inInput = document.activeElement && document.activeElement.tagName === 'INPUT';
  if (e.key === 'Escape' && sugBox.classList.contains('on')) { e.preventDefault(); hideSuggest(); return; }
  if (e.key === 'Escape') {
    if (inInput && document.activeElement.value && !overlay.classList.contains('on')) return;
    e.preventDefault(); back(); return;
  }
  if (e.key === 'Backspace' && !inInput) { e.preventDefault(); back(); return; }
  if (inInput && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) return;
  if (inInput && e.key === 'Enter' && document.activeElement.id === 'q') {
    e.preventDefault(); clearTimeout(searchTimer); hideSuggest(); rememberSearch($('q').value); runSearch().then(() => moveFocus('down')); return;
  }
  if (DIRS[e.key]) { e.preventDefault(); moveFocus(DIRS[e.key]); }
});

/* Mando de Xbox u otro gamepad: cruceta/stick para moverse, A abre, B vuelve */
let lastPad = 0, padHeld = [];
function pollPad(ts) {
  const pad = [...(navigator.getGamepads ? navigator.getGamepads() : [])].find(Boolean);
  if (pad) {
    const b = i => pad.buttons[i] && pad.buttons[i].pressed;
    const x = pad.axes[0] || 0, y = pad.axes[1] || 0;
    const dir = b(15) || x > 0.6 ? 'right' : b(14) || x < -0.6 ? 'left' : b(13) || y > 0.6 ? 'down' : b(12) || y < -0.6 ? 'up' : null;
    if (dir && ts - lastPad > 200) {
      lastPad = ts;
      if (view === 'menu' && !overlay.classList.contains('on')) menuKey({ key: { right: 'ArrowRight', left: 'ArrowLeft', down: 'ArrowDown', up: 'ArrowUp' }[dir] });
      else moveFocus(dir);
    }
    if (b(0) && !padHeld[0]) {
      if (view === 'menu' && !overlay.classList.contains('on')) openTile(index);
      else if (document.activeElement) document.activeElement.click();
    }
    if (b(1) && !padHeld[1]) back();
    padHeld = [b(0), b(1)];
  }
  requestAnimationFrame(pollPad);
}
requestAnimationFrame(pollPad);

/* ================= Reloj y cursor ================= */
function tick() {
  const now = new Date();
  const h = now.getHours();
  $('clock').textContent = now.toLocaleTimeString(LANG, { hour: '2-digit', minute: '2-digit' });
  $('date').textContent = now.toLocaleDateString(LANG, { weekday: 'long', day: 'numeric', month: 'long' });
  $('greeting').textContent = h < 6 ? 'Buenas noches' : h < 13 ? 'Buenos días' : h < 20 ? 'Buenas tardes' : 'Buenas noches';
}
tick();
setInterval(tick, 10000);

let idleTimer;
document.addEventListener('mousemove', () => {
  document.body.classList.remove('idle');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => document.body.classList.add('idle'), 3000);
});

buildMenuTiles();
updateProfileButton();
select(index);
syncRun();

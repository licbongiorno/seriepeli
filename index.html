<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0c10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Centro">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="centro.ico">
<link rel="apple-touch-icon" href="icono-192.png">
<title>Centro Multimedia</title>
<link rel="preconnect" href="https://api.themoviedb.org">
<link rel="preconnect" href="https://image.tmdb.org">
<style>
  :root {
    --bg: #0b0c10;
    --bg-glow: #1a1d29;
    --surface: #161925;
    --surface-2: #20243a;
    --text: #f5f6fa;
    --muted: #9aa0b4;
    --focus: #ffffff;
    --netflix: #e50914;
    --max: #2f55ff;
    --disney: #13a7c4;
    --youtube: #ff0000;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% -10%, var(--bg-glow) 0%, var(--bg) 60%);
    background-attachment: fixed;
    color: var(--text);
    font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
    user-select: none;
  }
  body.idle { cursor: none; }
  .view { position: fixed; inset: 0; display: none; flex-direction: column; }
  .view.on { display: flex; }
  button { font: inherit; color: inherit; }
  :focus { outline: none; }

  /* ---------- Menú ---------- */
  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding: 5vh 6vw 0;
  }
  .greeting { font-size: clamp(28px, 2.6vw, 52px); font-weight: 600; letter-spacing: -0.02em; }
  .date { font-size: clamp(16px, 1.2vw, 24px); color: var(--muted); margin-top: .4em; text-transform: capitalize; }
  .clock { font-size: clamp(40px, 4.4vw, 88px); font-weight: 300; font-variant-numeric: tabular-nums; letter-spacing: -0.03em; }

  #menu main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 5vw;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(var(--cols, 6), 1fr);
    gap: 1.8vw;
    width: 100%;
    max-width: 1760px;
  }
  .tile {
    position: relative;
    aspect-ratio: 2 / 3;
    border-radius: 22px;
    border: none;
    color: #fff;
    cursor: pointer;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.2em;
    box-shadow: 0 10px 30px rgba(0,0,0,.45);
    transition: transform .22s cubic-bezier(.2,.8,.2,1), box-shadow .22s, filter .22s;
    filter: saturate(.85) brightness(.82);
  }
  .tile::after {
    content: "";
    position: absolute; inset: 0;
    border-radius: inherit;
    border: 4px solid transparent;
    transition: border-color .22s;
  }
  .tile.active {
    transform: scale(1.08);
    filter: none;
    box-shadow: 0 24px 60px rgba(0,0,0,.6);
    z-index: 1;
  }
  .tile.active::after { border-color: var(--focus); }
  .tile svg { width: 34%; height: auto; }
  .name { font-size: clamp(17px, 1.45vw, 30px); font-weight: 700; letter-spacing: -0.01em; text-align: center; padding: 0 .4em; }
  .key {
    position: absolute; top: 14px; left: 16px;
    font-size: clamp(12px, .8vw, 16px);
    background: rgba(0,0,0,.35);
    border-radius: 8px;
    padding: 2px 9px;
    opacity: .8;
  }

  .netflix  { background: linear-gradient(160deg, #1c0002 0%, #000 70%); }
  .netflix .name { color: var(--netflix); font-size: clamp(20px, 1.8vw, 38px); letter-spacing: .02em; }
  .max      { background: linear-gradient(160deg, #0026ff 0%, #4a1fd1 55%, #160a3d 100%); }
  .disney   { background: linear-gradient(160deg, #0e2a6b 0%, #0b1335 60%, #04071a 100%); }
  .disney svg { color: #39e1f5; }
  .youtube  { background: linear-gradient(160deg, #ff2a2a 0%, #c40000 100%); }
  .ytmusic  { background: linear-gradient(160deg, #2b2b2b 0%, #0f0f0f 100%); }
  .ytmusic svg { color: #ff1f1f; }
  .explore  { background: linear-gradient(160deg, #f5b301 0%, #e0761a 55%, #6b2a0a 100%); }

  footer {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 1.2em 2.6em;
    padding: 0 6vw 5vh;
    color: var(--muted);
    font-size: clamp(13px, .95vw, 18px);
  }
  kbd {
    font-family: inherit;
    color: var(--text);
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.14);
    border-radius: 6px;
    padding: 1px 8px;
    margin-right: .35em;
  }

  /* ---------- Buscar y tendencias ---------- */
  .topbar {
    display: flex;
    align-items: center;
    gap: 1.2vw;
    padding: 3.5vh 4vw 2vh;
  }
  .btn {
    background: var(--surface-2);
    border: 3px solid transparent;
    border-radius: 14px;
    padding: .55em 1.1em;
    font-size: clamp(15px, 1vw, 20px);
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: border-color .15s, background .15s, transform .15s;
  }
  .btn:focus, .btn:hover { border-color: var(--focus); background: #2c3150; }
  .btn.primary { background: #fff; color: #0b0c10; }
  .btn.primary:focus, .btn.primary:hover { border-color: #f5b301; background: #fff; }
  .btn.svc-netflix { background: var(--netflix); color: #fff; }
  .btn.svc-max { background: var(--max); color: #fff; }
  .btn.svc-disney { background: var(--disney); color: #fff; }
  .btn.svc-youtube { background: var(--youtube); color: #fff; }

  .tbtns { display: contents; }
  .search {
    flex: 1;
    min-width: 12em;
    display: flex;
    align-items: center;
    gap: .8em;
    background: var(--surface);
    border: 3px solid var(--surface-2);
    border-radius: 16px;
    padding: 0 1.1em;
    transition: border-color .15s;
  }
  .search:focus-within { border-color: var(--focus); }
  .search svg { width: 1.6em; height: 1.6em; color: var(--muted); flex: none; }
  .search input {
    flex: 1;
    min-width: 0;
    background: none;
    border: none;
    color: var(--text);
    font: inherit;
    font-size: clamp(18px, 1.35vw, 28px);
    padding: .55em 0;
    user-select: text;
  }
  .search input::placeholder { color: var(--muted); }

  .content {
    flex: 1;
    overflow-y: auto;
    padding: 0 0 6vh;
    scrollbar-width: none;
  }
  .content::-webkit-scrollbar { display: none; }
  .row { margin-top: 2.4vh; }
  .row h2 {
    font-size: clamp(18px, 1.35vw, 28px);
    font-weight: 650;
    padding: 0 4vw;
    margin-bottom: 1.2vh;
    display: flex;
    align-items: center;
    gap: .6em;
  }
  .dot { width: .7em; height: .7em; border-radius: 50%; display: inline-block; }
  .face { width: 2.4em; height: 2.4em; border-radius: 50%; object-fit: cover; box-shadow: 0 4px 12px rgba(0,0,0,.5); }
  .strip {
    display: flex;
    gap: 1.1vw;
    overflow-x: auto;
    padding: 14px 4vw 18px;
    scroll-padding: 0 4vw;
    scrollbar-width: none;
  }
  .strip::-webkit-scrollbar { display: none; }
  .results {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(clamp(130px, 10.5vw, 210px), 1fr));
    gap: 2.4vh 1.1vw;
    padding: 14px 4vw 18px;
  }
  .card {
    flex: none;
    width: clamp(130px, 10.5vw, 210px);
    background: none;
    border: none;
    cursor: pointer;
    text-align: left;
    transition: transform .18s cubic-bezier(.2,.8,.2,1);
  }
  .results .card { width: auto; }
  .poster {
    position: relative;
    aspect-ratio: 2 / 3;
    border-radius: 14px;
    overflow: hidden;
    background: var(--surface-2);
    box-shadow: 0 8px 22px rgba(0,0,0,.45);
  }
  .poster::after {
    content: "";
    position: absolute; inset: 0;
    border-radius: inherit;
    border: 4px solid transparent;
    transition: border-color .18s;
  }
  .poster img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .poster .noimg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 1em; text-align: center; color: var(--muted); font-size: 14px; }
  .card:focus, .card:hover { transform: scale(1.07); }
  .card:focus .poster::after, .card:hover .poster::after { border-color: var(--focus); }
  .card .t {
    margin-top: .55em;
    font-size: clamp(13px, .85vw, 17px);
    font-weight: 600;
    line-height: 1.25;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card .y { font-size: clamp(12px, .75vw, 15px); color: var(--muted); margin-top: .15em; }
  .badges {
    position: absolute; left: 8px; right: 8px; bottom: 8px;
    display: flex; flex-wrap: wrap; gap: 5px;
  }
  .badge {
    font-size: clamp(10px, .65vw, 13px);
    font-weight: 700;
    color: #fff;
    border-radius: 6px;
    padding: 2px 7px;
    box-shadow: 0 2px 6px rgba(0,0,0,.5);
  }
  .badge.netflix { background: var(--netflix); }
  .badge.max { background: var(--max); }
  .badge.disney { background: var(--disney); }
  .badge.youtube { background: var(--youtube); }
  .badge.none { background: rgba(0,0,0,.7); color: #cfd3e0; font-weight: 600; }

  .msg {
    padding: 4vh 4vw;
    color: var(--muted);
    font-size: clamp(16px, 1.1vw, 22px);
    line-height: 1.6;
  }
  .msg strong { color: var(--text); }

  .setup {
    max-width: 920px;
    margin: 4vh auto 0;
    background: var(--surface);
    border-radius: 22px;
    padding: 4vh 3vw;
    font-size: clamp(15px, 1.05vw, 20px);
    line-height: 1.6;
  }
  .setup h2 { font-size: clamp(22px, 1.7vw, 34px); margin-bottom: .6em; }
  .setup ol { margin: 1em 0 1.4em 1.4em; }
  .setup li { margin: .35em 0; }
  .setup code { background: var(--surface-2); padding: 1px 7px; border-radius: 6px; }
  .setup .search { margin-bottom: 1em; }
  .setup .error { color: #ff7b7b; min-height: 1.6em; }

  /* ---------- Detalle ---------- */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(5,6,10,.82);
    backdrop-filter: blur(6px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 4vh 4vw;
    z-index: 10;
  }
  .overlay.on { display: flex; }
  .detail {
    display: flex;
    gap: 2.6vw;
    max-width: 1300px;
    width: 100%;
    max-height: 100%;
    background: var(--surface);
    border-radius: 24px;
    padding: 3.5vh 2.6vw;
    box-shadow: 0 30px 80px rgba(0,0,0,.6);
  }
  .detail .poster { width: clamp(180px, 17vw, 330px); flex: none; align-self: flex-start; }
  .detail .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1.6vh; overflow-y: auto; }
  .detail h3 { font-size: clamp(24px, 2.1vw, 42px); line-height: 1.15; letter-spacing: -0.02em; }
  .meta { color: var(--muted); font-size: clamp(14px, 1vw, 20px); }
  .overview { font-size: clamp(14px, .98vw, 19px); line-height: 1.55; color: #d6d9e4; max-height: 30vh; overflow-y: auto; }
  .where { font-size: clamp(15px, 1.05vw, 21px); font-weight: 600; }
  .where small { display: block; font-weight: 400; color: var(--muted); margin-top: .3em; }
  .actions { display: flex; flex-wrap: wrap; gap: .9em; margin-top: auto; padding-top: 1vh; }

  .loading {
    position: fixed; inset: 0;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(22px, 2vw, 38px);
    font-weight: 600;
    opacity: 0; pointer-events: none;
    transition: opacity .25s;
    z-index: 20;
  }
  .loading.show { opacity: 1; }
  .credit { padding: 3vh 4vw 0; color: #5d6378; font-size: 13px; }

  /* ---------- Filtros ---------- */
  .filters {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: .6em 1.6em;
    padding: 0 4vw 1.2vh;
    font-size: clamp(13px, .85vw, 16px);
  }
  .filters.off { display: none; }
  .fgroup { display: flex; align-items: center; gap: .4em; }
  .fgroup > span { color: var(--muted); margin-right: .2em; }
  .chip {
    background: var(--surface);
    border: 2px solid var(--surface-2);
    border-radius: 999px;
    padding: .3em .9em;
    cursor: pointer;
    font-weight: 600;
    color: #c9cdda;
    transition: border-color .15s, background .15s, color .15s;
  }
  .chip:focus, .chip:hover { border-color: var(--focus); color: #fff; }
  .chip.on { background: #fff; color: #0b0c10; border-color: #fff; }
  .chip.on:focus { border-color: #f5b301; }

  /* ---------- Tarjetas: vistas y orden ---------- */
  .card.seen .poster img { opacity: .4; }
  .seen-tag {
    position: absolute; top: 8px; right: 8px;
    background: rgba(0,0,0,.75); color: #fff;
    font-size: clamp(10px, .65vw, 13px); font-weight: 700;
    border-radius: 6px; padding: 2px 7px;
  }
  .list-tag {
    position: absolute; top: 8px; left: 8px;
    background: #f5b301; color: #111;
    font-size: clamp(10px, .65vw, 13px); font-weight: 800;
    border-radius: 6px; padding: 2px 7px;
  }

  /* ---------- Ficha ampliada ---------- */
  .detail { flex-direction: column; overflow-y: auto; scrollbar-width: none; }
  .detail::-webkit-scrollbar { display: none; }
  .detail .top { display: flex; gap: 2.6vw; }
  .detail .info { overflow: visible; }
  .detail .overview { max-height: none; }
  .facts { color: #c9cdda; font-size: clamp(13px, .9vw, 18px); line-height: 1.6; }
  .facts b { color: var(--muted); font-weight: 600; }
  .cert { display: inline-block; border: 2px solid var(--muted); border-radius: 6px; padding: 0 .4em; font-weight: 700; color: var(--text); }
  .more h4 { font-size: clamp(17px, 1.2vw, 24px); margin: 3vh 0 1vh; }
  .more .strip { padding: 10px 2px 14px; }
  .person {
    flex: none;
    width: clamp(96px, 7vw, 130px);
    background: none; border: none; cursor: pointer;
    text-align: center;
    transition: transform .15s;
  }
  .person img, .person .ph {
    width: 100%; aspect-ratio: 1; border-radius: 50%; object-fit: cover;
    background: var(--surface-2); border: 3px solid transparent; display: block;
  }
  .person .ph { display: flex; align-items: center; justify-content: center; font-size: 2em; color: var(--muted); }
  .person:focus, .person:hover { transform: scale(1.06); }
  .person:focus img, .person:hover img, .person:focus .ph, .person:hover .ph { border-color: var(--focus); }
  .person .pn { font-size: clamp(12px, .8vw, 15px); font-weight: 600; margin-top: .4em; line-height: 1.2; }
  .person .pc { font-size: clamp(11px, .7vw, 13px); color: var(--muted); margin-top: .15em; line-height: 1.2; }
  .btn.on { background: #f5b301; color: #111; }

  .scores { display: flex; flex-wrap: wrap; gap: .6em; }
  .score {
    display: inline-flex; align-items: baseline; gap: .4em;
    background: var(--surface-2); border-radius: 10px;
    padding: .3em .8em; font-size: clamp(13px, .9vw, 17px); color: #c9cdda;
  }
  .score b { color: #fff; font-size: 1.15em; }
  .score small { color: var(--muted); font-size: .8em; }
  .score.imdb { background: #f5c518; color: #111; }
  .score.imdb b { color: #000; }
  .score.imdb small { color: #333; }
  .score.rt { background: #fa320a; color: #fff; }
  .score.mc { background: #2b6cb0; color: #fff; }
  .rank {
    position: absolute; top: 4px; left: 8px;
    font-size: clamp(30px, 2.4vw, 50px); font-weight: 900; line-height: 1;
    color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,.9), 0 0 2px #000;
  }
  .cats h3 { font-size: clamp(17px, 1.2vw, 24px); margin: 2.6vh 0 1.2vh; color: var(--muted); }
  .cats .wrap { display: flex; flex-wrap: wrap; gap: .6em; font-size: clamp(14px, .95vw, 18px); }
  .cats .chip { padding: .5em 1.15em; }

  .seasons { display: flex; flex-wrap: wrap; gap: .5em; font-size: clamp(13px, .9vw, 17px); }
  .seasons small { opacity: .7; font-weight: 400; }
  .eps { display: flex; flex-direction: column; gap: .8vh; margin-top: 1.4vh; }
  .ep {
    display: flex; gap: 1.2vw; align-items: flex-start; text-align: left;
    background: var(--surface-2); border: 3px solid transparent; border-radius: 14px;
    padding: .6em; cursor: pointer; transition: border-color .15s;
  }
  .ep:focus, .ep:hover { border-color: var(--focus); }
  .ep[disabled] { opacity: .5; cursor: default; }
  .ep.done { opacity: .62; }
  .eimg { position: relative; width: clamp(130px, 11vw, 220px); aspect-ratio: 16 / 9; flex: none; border-radius: 10px; overflow: hidden; background: var(--surface); }
  .eimg img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .eimg .noimg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 1.6em; }
  .einfo { min-width: 0; }
  .et { font-weight: 700; font-size: clamp(14px, .95vw, 18px); }
  .em { color: var(--muted); font-size: clamp(12px, .8vw, 15px); margin: .2em 0 .35em; }
  .eo { color: #c9cdda; font-size: clamp(12px, .82vw, 15px); line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card.current .poster::after { border-color: #f5b301; }
  .caption { font-size: clamp(11px, .75vw, 14px); color: #f5b301; font-weight: 700; margin-top: .15em; }

  /* ---------- Perfiles, estadísticas y autocompletar ---------- */
  .profiles { display: flex; flex-wrap: wrap; gap: 1.6vw; margin: 1vh 0 2vh; }
  .prof {
    width: clamp(120px, 9vw, 170px); background: none; border: none; cursor: pointer; text-align: center;
  }
  .prof .av {
    width: 100%; aspect-ratio: 1; border-radius: 22px; background: var(--surface-2);
    display: flex; align-items: center; justify-content: center; font-size: clamp(44px, 4vw, 78px);
    border: 4px solid transparent; transition: border-color .15s, transform .15s;
  }
  .prof:focus .av, .prof:hover .av { border-color: var(--focus); transform: scale(1.05); }
  .prof.on .av { border-color: #f5b301; }
  .prof .pn { margin-top: .5em; font-weight: 700; font-size: clamp(14px, 1vw, 19px); }
  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 1.2vw; margin: 1vh 0 1vh; }
  .stat { background: var(--surface); border-radius: 18px; padding: 2vh 1.2vw; }
  .stat b { display: block; font-size: clamp(26px, 2.2vw, 44px); line-height: 1.1; }
  .stat span { color: var(--muted); font-size: clamp(13px, .9vw, 17px); }
  .bars { display: flex; flex-direction: column; gap: .7vh; max-width: 900px; }
  .bar { display: grid; grid-template-columns: 11em 1fr 3em; align-items: center; gap: .8em; font-size: clamp(13px, .9vw, 17px); }
  .bar i { display: block; height: .8em; border-radius: 999px; background: linear-gradient(90deg, #f5b301, #e0761a); }
  .bar em { color: var(--muted); font-style: normal; text-align: right; }
  .suggest {
    position: absolute; z-index: 15;
    background: var(--surface); border: 2px solid var(--surface-2); border-radius: 16px;
    box-shadow: 0 24px 60px rgba(0,0,0,.6);
    padding: .6em; display: none; flex-direction: column; gap: .3em;
    max-height: 70vh; overflow-y: auto;
  }
  .suggest.on { display: flex; }
  .suggest .sh { color: var(--muted); font-size: 13px; padding: .3em .6em; }
  .sug {
    display: flex; align-items: center; gap: .8em; text-align: left;
    background: none; border: 2px solid transparent; border-radius: 10px;
    padding: .35em .6em; cursor: pointer; font-size: clamp(14px, .95vw, 18px);
  }
  .sug:focus, .sug:hover { border-color: var(--focus); background: var(--surface-2); }
  .sug img, .sug .si { width: 34px; height: 50px; border-radius: 6px; object-fit: cover; flex: none; background: var(--surface-2); display: flex; align-items: center; justify-content: center; }
  .sug small { color: var(--muted); }
  .topbar { flex-wrap: wrap; position: relative; }

  /* ---------- ¿Qué veo hoy? ---------- */
  .picker { padding: 1vh 4vw 0; }
  .picker h2 { font-size: clamp(22px, 1.8vw, 36px); margin-bottom: 2.4vh; }
  .pgroup { display: flex; flex-wrap: wrap; align-items: center; gap: .6em; margin-bottom: 2vh; font-size: clamp(14px, 1vw, 19px); }
  .pgroup > span { width: 8.5em; color: var(--muted); font-weight: 600; }
  .picker .chip { padding: .45em 1.1em; }

<script>
/* ================= Servicios ================= */
// home: página principal; networks: cadenas de TMDB (para próximos estrenos); color: etiqueta

  apple:      { name: 'Apple TV+', color: '#6e6e73', home: 'https://tv.apple.com/ar', networks: [2552],

  crunchyroll:{ name: 'Crunchyroll', color: '#f47521', home: 'https://www.crunchyroll.com/es', networks: [],
                match: n => /crunchyroll/i.test(n), open: q => 'https://www.crunchyroll.com/es/search?q=' + q },
  mubi:       { name: 'MUBI', color: '#3b3b98', home: 'https://mubi.com/es', networks: [],

  vix:        { name: 'ViX', color: '#ff5a00', home: 'https://vix.com/', networks: [],
                match: n => /^vix/i.test(n), direct: true, open: q => 'https://vix.com/' },

// Plataformas que pagas (se eligen en ⚙). Por defecto, las tres originales.

function loadPlatforms() {
  try { const p = JSON.parse(localStorage.getItem('cm-platforms')); if (Array.isArray(p) && p.length) return p.filter(s => SERVICES[s]); } catch (e) {}
  return ['netflix', 'max', 'disney'];
}
let PREMIUM = loadPlatforms();
// "Netflix, HBO Max y Disney+" según las plataformas elegidas
function svcList(conj = 'y') {
  const n = PREMIUM.map(s => SERVICES[s].name);

const REGION = 'AR';

let tiles = [...document.querySelectorAll('.tile')];
let index = 0;
{ const saved = parseInt(store('cm-last'), 10); if (saved >= 0 && saved < tiles.length) index = saved; }

  index = (i + tiles.length) % tiles.length;

  const cols = getComputedStyle($('grid')).gridTemplateColumns.split(' ').length;
  switch (e.key) {
    case 'ArrowRight': select(index + 1); break;
    case 'ArrowLeft':  select(index - 1); break;

    case 'ArrowUp':    select(Math.max(index - cols, 0)); break;

}

/* ===== Configuración que llega en el enlace "📱 Pasar al celular" (#cfg=...) ===== */
const PUBLIC_URL = 'https://licbongiorno.github.io/seriepeli/';
const toB64 = o => btoa(String.fromCharCode(...new TextEncoder().encode(JSON.stringify(o)))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const fromB64 = t => JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(t.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0))));
{
  const m = location.hash.match(/[#&]cfg=([\w-]+)/);
  if (m) {
    try {
      const c = fromB64(m[1]);
      if (c.k) store('tmdb-key', c.k);
      if (c.o) store('omdb-key', c.o);
      if (Array.isArray(c.p) && c.p.length) { store('cm-platforms', JSON.stringify(c.p)); PREMIUM = loadPlatforms(); }
      // Se une a la misma sincronización que la PC: la primera vez baja los datos de allá
      if (c.s && c.s.id) { localStorage.setItem('cm-sync', JSON.stringify(c.s)); localStorage.setItem('cm-sync-at', '0'); localStorage.removeItem('cm-sync-dirty'); }

}
function phoneLink() {
  const base = /^https?:$/.test(location.protocol) ? location.origin + location.pathname : PUBLIC_URL;
  const s = syncCfg();
  return base + '#cfg=' + toB64({ k: apiKey === DEFAULT_TMDB_KEY ? undefined : apiKey, o: omdbKey || undefined, p: PREMIUM, s: s ? { p: s.p, id: s.id, key: s.key } : undefined });
}

/* ================= TMDB ================= */
// Clave de TMDB fija: cualquier dispositivo que abra el centro ya queda listo (se puede cambiar en ⚙)
const DEFAULT_TMDB_KEY = 'eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiI4ZTVkZTQ1OWU4M2YyM2U2OWUzZmQwZTQzNDI0NjYwMiIsIm5iZiI6MTc5MTQ5MTI1MC44OTUsInN1YiI6IjZhYzdmY2IyNmFkM2I5ZDEzY2ZhZTU0OSIsInNjb3BlcyI6WyJhcGlfcmVhZCJdLCJ2ZXJzaW9uIjoxfQ.VPQ0jrvlx5TgpDSjVZFQC6YFFNUx6wS074C7rWXRuGI';
let apiKey = store('tmdb-key') || DEFAULT_TMDB_KEY;
let omdbKey = store('omdb-key') || '';

/* ===== Memoria de respuestas (velocidad) =====
   Guarda cada respuesta de TMDB un tiempo en el equipo: volver a una búsqueda o a
   las tendencias es instantáneo. Si el espacio se llena, borra lo más viejo. */
const HOUR = 3600e3;
const memCache = new Map();
function ttlFor(path) {
  if (path.startsWith('search/')) return 6 * HOUR;
  if (path.startsWith('trending/') || path.startsWith('discover/')) return 3 * HOUR;
  return 24 * HOUR; // fichas, personas, palabras clave, plataformas
}
// stale = true: devuelve el dato aunque esté vencido (sirve cuando no hay internet)
function cacheGet(key, stale = false) {
  try {
    let e = memCache.get(key);
    if (!e) {
      const raw = localStorage.getItem(key);
      if (!raw) return null;
      e = JSON.parse(raw);
      memCache.set(key, e);
    }
    return stale || Date.now() - e.t <= e.ttl ? e : null;
  } catch (err) { return null; }
}
function cacheSet(key, data, ttl) {
  const e = { t: Date.now(), ttl, d: data };
  memCache.set(key, e);
  const json = JSON.stringify(e);
  for (let attempt = 0; attempt < 2; attempt++) {
    try { localStorage.setItem(key, json); return; }
    catch (err) { purgeCache(); }
  }
}
function purgeCache() {
  try {
    const entries = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && (k.startsWith('c:') || k.startsWith('p:'))) {
        let t = 0; try { t = JSON.parse(localStorage.getItem(k)).t; } catch (e) {}
        entries.push([k, t]);
      }
    }
    entries.sort((a, b) => a[1] - b[1]).slice(0, Math.ceil(entries.length / 2)).forEach(([k]) => localStorage.removeItem(k));
  } catch (e) {}
}

async function api(path, params = {}, useCache = true, ttl = 0) {
  const url = new URL('https://api.themoviedb.org/3/' + path);
  url.searchParams.set('language', LANG);
  for (const [k, v] of Object.entries(params)) url.searchParams.set(k, v);
  url.searchParams.sort();
  const key = 'c:' + path + '?' + url.searchParams.toString();
  if (useCache) { const hit = cacheGet(key); if (hit) return hit.d; }
  const headers = { accept: 'application/json' };
  if (apiKey.startsWith('eyJ')) headers.Authorization = 'Bearer ' + apiKey;
  else url.searchParams.set('api_key', apiKey);
  let r;
  try { r = await fetch(url, { headers }); }
  catch (e) { const old = cacheGet(key, true); if (old) return old.d; throw e; } // sin internet: lo último guardado
  if (r.status === 401) throw new Error('clave');
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const data = await r.json();
  if (useCache) cacheSet(key, data, ttl || ttlFor(path));
  return data;
}

// Limita las consultas simultáneas para no saturar a TMDB
let running = 0;
const waiting = [];
async function limited(fn) {
  while (running >= 8) await new Promise(r => waiting.push(r));
  running++;
  try { return await fn(); } finally { running--; const next = waiting.shift(); if (next) next(); }
}

const provCache = new Map();
async function providers(type, id) {
  const k = type + '/' + id;
  if (!provCache.has(k)) {
    // Se guarda solo el resumen (pequeño) por 24 h, no la respuesta completa con todos los países
    const saved = cacheGet('p:' + k) || (navigator.onLine ? null : cacheGet('p:' + k, true));
    if (saved) { provCache.set(k, Promise.resolve(saved.d)); return provCache.get(k); }
    provCache.set(k, limited(() => api(`${type}/${id}/watch/providers`, {}, false)).then(d => {
      const r = (d.results || {})[REGION] || {};
      const mine = new Set(), others = new Set(), rent = new Set();
      for (const p of (r.flatrate || []).concat(r.ads || [], r.free || [])) {
        const s = Object.keys(SERVICES).find(key => SERVICES[key].match(p.provider_name));
        if (s) mine.add(s); else others.add(p.provider_name);
      }
      for (const p of (r.rent || []).concat(r.buy || [])) rent.add(p.provider_name);
      const out = { mine: [...mine], others: [...others], rent: [...rent] };
      cacheSet('p:' + k, out, 24 * HOUR);
      return out;
    }).catch(() => ({ mine: [], others: [], rent: [] })));
  }
  return provCache.get(k);
}

const typeOf = r => r.media_type || r._type;
const isMine = p => p.mine.some(s => PREMIUM.includes(s));

// Deja solo los títulos que están en tus plataformas en Argentina
async function onlyMine(list) {
  const ps = await Promise.all(list.map(r => providers(typeOf(r), r.id)));
  return list.filter((r, i) => isMine(ps[i]));
}

let svcIds = null;
async function serviceIds() {
  if (svcIds) return svcIds;
  const [m, t] = await Promise.all([
    api('watch/providers/movie', { watch_region: REGION }),
    api('watch/providers/tv', { watch_region: REGION })
  ]);
  svcIds = {};
  for (const p of (m.results || []).concat(t.results || [])) {
    const s = Object.keys(SERVICES).find(k => SERVICES[k].match(p.provider_name));
    if (s && s !== 'youtube') (svcIds[s] = svcIds[s] || new Set()).add(p.provider_id);
  }
  return svcIds;
}

function saveLists() {
  store(pk('list'), JSON.stringify(myList.slice(0, 300)));

function toggleList(it) {
  const k = keyOf(it);
  if (inList(k)) myList = myList.filter(x => keyOf(x) !== k);
  else { myList.unshift(slim(it)); seenList = seenList.filter(x => keyOf(x) !== k); }
  saveLists();
}
function toggleSeen(it) {
  const k = keyOf(it);
  if (isSeen(k)) seenList = seenList.filter(x => keyOf(x) !== k);
  else { seenList.unshift({ ...slim(it), like: 0, at: Date.now() }); myList = myList.filter(x => keyOf(x) !== k); }
  saveLists();
}
// 👍 / 👎: marca como vista si no lo estaba; tocar el mismo pulgar otra vez lo quita
function setLike(it, v) {
  const k = keyOf(it);
  if (!isSeen(k)) toggleSeen(it);
  seenList = seenList.map(x => keyOf(x) === k ? { ...x, like: x.like === v ? 0 : v } : x);
  saveLists();
}
function toggleFollow(it, d) {
  if (isFollowed(it.id)) follows = follows.filter(x => x.id !== it.id);
  else follows.unshift({ id: it.id, name: it.title || it.name, poster_path: it.poster_path, vote_average: it.vote_average, first_air_date: it.release_date || it.first_air_date, genre_ids: it.genre_ids || (d && d.genres || []).map(g => g.id) });

}

function cardHTML(it, knownSvc, caption) {
  const type = it.media_type || it._type;
  const key = type + '/' + it.id;
  items.set(key, { ...it, media_type: type });
  const title = it.title || it.name;
  const year = (it.release_date || it.first_air_date || '').slice(0, 4);
  const img = it.poster_path
    ? `<img loading="lazy" src="${IMG}w342${it.poster_path}" alt="">`
    : `<div class="noimg">${esc(title)}</div>`;
  const badges = knownSvc ? badgeHTML(knownSvc) : '';
  const seen = isSeen(key);
  const tag = seen ? '<span class="seen-tag">✓ Vista</span>' : inList(key) ? '<span class="list-tag">📌</span>' : '';
  // Datos para los filtros: tipo, puntuación (x10), año y plataformas
  // data-w: puntuación ponderada por cantidad de votos, para que un 10 con 3 votos no gane a un 8,5 con 20.000
  const v = it.vote_count || 0, w = v ? Math.round(((v * (it.vote_average || 0)) + 150 * 6.5) / (v + 150) * 100) : 0;
  const data = `data-g="${(it.genre_ids || []).join(' ')}" data-l="${it.original_language || ''}" data-t="${type}" data-r="${Math.round((it.vote_average || 0) * 10)}" data-w="${w}" data-y="${parseInt(year, 10) || 0}"${knownSvc ? ` data-svcs="${knownSvc}"` : ''}`;
  return `<button class="card focusable${seen ? ' seen' : ''}" data-key="${key}" ${data}>
      <div class="poster">${img}<div class="badges">${badges}</div>${tag}</div>
      <div class="t">${esc(title)}</div>
      <div class="y">${type === 'tv' ? 'Serie' : 'Película'}${year ? ' · ' + year : ''}</div>${caption ? `<div class="caption">${esc(caption)}</div>` : ''}
    </button>`;
}

const badgeHTML = s => `<span class="badge ${s}" style="background:${SERVICES[s].color}">${SERVICES[s].name}</span>`;

function fillBadges(root) {
  root.querySelectorAll('.card').forEach(async card => {
    const box = card.querySelector('.badges');
    if (box.children.length) return;
    const [type, id] = card.dataset.key.split('/');
    const p = await providers(type, id);
    const mine = p.mine.filter(s => PREMIUM.includes(s));
    card.dataset.svcs = mine.join(' ');
    box.innerHTML = mine.length
      ? mine.map(badgeHTML).join('')
      : `<span class="badge none">No está en tus servicios</span>`;
  });
}

function rowHTML(title, cards, dot) {
  return `<section class="row"><h2>${dot ? `<span class="dot" style="background:${(SERVICES[dot] || {}).color}"></span>` : ''}${esc(title)}</h2>
    <div class="strip">${cards}</div></section>`;
}

function interleave(a, b) {
  const out = [];
  for (let i = 0; i < Math.max(a.length, b.length); i++) { if (a[i]) out.push(a[i]); if (b[i]) out.push(b[i]); }
  return out;
}

async function loadTrending() {
  exploreLoaded = true;
  $('filters').classList.remove('off');
  const seq = ++searchSeq;
  content.innerHTML = '<div class="msg">Cargando tendencias…</div>';
  try {
    const ids = await serviceIds();
    const discover = (type, set) => api('discover/' + type, {
      watch_region: REGION,
      with_watch_providers: [...set].join('|'),
      with_watch_monetization_types: 'flatrate',
      sort_by: 'popularity.desc'
    }).then(d => d.results.map(r => ({ ...r, _type: type })));

    const svcRows = Object.keys(ids).map(async s => {
      const [mv, tv] = await Promise.all([discover('movie', ids[s]), discover('tv', ids[s])]);
      return { s, list: notSeen(interleave(tv, mv)).slice(0, 24) };
    });

    // Filas especiales sobre las tres plataformas juntas
    const allIds = [...new Set(PREMIUM.flatMap(s => [...(ids[s] || [])]))].join('|');
    const both = async (movieParams, tvParams) => {
      const base = { watch_region: REGION, with_watch_providers: allIds, with_watch_monetization_types: 'flatrate' };
      const [mv, tv] = await Promise.all([
        api('discover/movie', { ...base, ...movieParams }).then(d => d.results.map(r => ({ ...r, _type: 'movie' }))),
        api('discover/tv', { ...base, ...tvParams }).then(d => d.results.map(r => ({ ...r, _type: 'tv' })))
      ]);
      return notSeen(interleave(mv, tv)).slice(0, 30);
    };
    const daysAgo = n => new Date(Date.now() - n * 864e5).toISOString().slice(0, 10);
    const today = daysAgo(0);
    const special = Promise.all([
      both({ 'primary_release_date.gte': daysAgo(120), 'primary_release_date.lte': today, sort_by: 'popularity.desc' },
           { 'first_air_date.gte': daysAgo(120), 'first_air_date.lte': today, sort_by: 'popularity.desc' }),
      both({ sort_by: 'vote_average.desc', 'vote_count.gte': 2500 },
           { sort_by: 'vote_average.desc', 'vote_count.gte': 800, without_genres: '16,10767,10763' }),
      both({ sort_by: 'vote_average.desc', 'vote_average.gte': 7.4, 'vote_count.gte': 150, 'vote_count.lte': 1200, without_genres: '99' },
           { sort_by: 'vote_average.desc', 'vote_average.gte': 7.8, 'vote_count.gte': 60, 'vote_count.lte': 500, without_genres: '16,99,10767,10763,10764' })
    ]);

    // Dos páginas de cada tendencia, para que queden suficientes títulos después de filtrar
    const trend = async (path, type) => {
      const pages = await Promise.all([1, 2].map(page => api(path, { page })));
      const list = pages.flatMap(p => p.results)
        .map(r => type ? { ...r, _type: type } : r)
        .filter(r => typeOf(r) === 'movie' || typeOf(r) === 'tv');
      return notSeen(await onlyMine(list)).slice(0, 24);
    };

    const [trendAll, trendTv, trendMovie, [fresh, best, gems], ...perSvc] = await Promise.all([
      trend('trending/all/day'),
      trend('trending/tv/week', 'tv'),
      trend('trending/movie/week', 'movie'),
      special,
      ...svcRows
    ]);

    const row = (title, list, svc) => list.length ? rowHTML(title, list.map(r => cardHTML(r, svc)).join(''), svc) : '';
    let html = '<div id="newEpsRow"></div><div id="forYouRows"></div><div id="myListRow"></div>';
    html += row('🔥 Lo más visto hoy en tus plataformas', trendAll);
    html += row('🆕 Estrenos recientes', fresh);
    const order = PREMIUM;
    perSvc.sort((a, b) => order.indexOf(a.s) - order.indexOf(b.s)).forEach(({ s, list }) => {
      html += row('Popular ahora en ' + SERVICES[s].name, list, s);
    });
    html += row('⭐ Las mejor puntuadas de tus plataformas', best);
    html += row('💎 Joyas ocultas: muy buenas y poco conocidas', gems);
    html += row('Series en tendencia esta semana', trendTv);
    html += row('Películas en tendencia esta semana', trendMovie);
    html += '<div id="seenRow"></div>';
    html += `<div class="credit">Solo títulos disponibles en ${svcList('o')} en Argentina. Datos de TMDB y JustWatch.</div>`;
    if (seq !== searchSeq) return; // el usuario empezó a buscar mientras cargaba
    content.innerHTML = html;
    renderMyRows();
    fillBadges(content);
    loadNewEpisodes(seq);
    loadForYou(seq);
  } catch (e) {
    if (seq !== searchSeq) return;
    if (e.message === 'clave') { store('tmdb-key', null); apiKey = ''; renderSetup('La clave guardada dejó de funcionar. Pégala de nuevo.'); return; }
    exploreLoaded = false;
    content.innerHTML = '<div class="msg">No se pudieron cargar las tendencias. Revisa tu conexión a internet y vuelve a entrar.</div>';
  }
}

const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();

// Convierte palabras clave en inglés a sus códigos de TMDB (con caché)
const kwCache = new Map();
async function keywordIds(terms) {
  const ids = await Promise.all(terms.map(term => {
    const t = term.toLowerCase();
    if (!kwCache.has(t)) {
      kwCache.set(t, limited(() => api('search/keyword', { query: term })).then(d => {
        const singular = t.replace(/(es|s)$/, '');
        return (d.results || [])
          .filter(r => { const n = r.name.toLowerCase(); return n === t || n === singular || n === t + 's'; })
          .map(r => r.id);
      }).catch(() => []));
    }
    return kwCache.get(t);
  }));
  return [...new Set(ids.flat())];
}

async function detectGenre(q) {
  const n = ' ' + norm(q) + ' ';
  const has = w => n.includes(' ' + w + ' ');
  const theme = THEMES.find(t => t.words.some(has));
  const genre = GENRES.find(g => g.words.some(has));
  const nation = NATIONS.find(x => x.words.some(has));

  let kw = [], label = theme ? theme.label : '';
  if (theme) kw = await keywordIds(theme.terms);
  else if (!genre && !nation) {
    // Palabra que no está en las listas: probar si es una palabra clave de TMDB ("kung fu", "zombie", "heist"…)
    kw = await keywordIds([norm(q)]);
    if (kw.length) label = q.charAt(0).toUpperCase() + q.slice(1);
  }
  if (!genre && !nation && !kw.length) return null;

  let movie = genre ? (genre.movie ? { ...genre.movie } : null) : {};
  let tv = genre ? (genre.tv ? { ...genre.tv } : null) : {};
  if (kw.length) for (const p of [movie, tv]) if (p) p.with_keywords = kw.join('|');
  if (nation) for (const p of [movie, tv]) if (p) Object.assign(p, nation.p);

  const wantsTv = /\b(serie|series|novela|novelas|reality|dorama|doramas|kdrama|kdramas)\b/.test(n);
  const wantsMovie = /\b(pelicula|peliculas|peli|pelis|film|films)\b/.test(n);
  if (wantsTv && !wantsMovie) movie = null;
  if (wantsMovie && !wantsTv) tv = null;
  if (!movie && !tv) return null;

  const parts = [label || (genre && genre.label), label && genre ? genre.label.toLowerCase() : '', nation ? nation.label : ''].filter(Boolean);
  if (nation && parts.length === 1) parts[0] = 'Producciones ' + nation.label;
  return { label: parts.join(' · '), movie, tv, fromList: !!(theme || genre || nation) };
}

async function genreRows(g, seq) {
  const box = $('genreRows');
  const ids = await serviceIds();
  const get = (type, params, set) => Promise.all([1, 2].map(page => api('discover/' + type, {
    ...params, page,
    watch_region: REGION,
    with_watch_providers: [...set].join('|'),
    with_watch_monetization_types: 'flatrate',
    sort_by: 'popularity.desc'
  }))).then(ps => ps.flatMap(p => p.results).map(r => ({ ...r, _type: type })));

  const rows = await Promise.all(PREMIUM.filter(s => ids[s]).map(async s => {
    const [mv, tv] = await Promise.all([
      g.movie ? get('movie', g.movie, ids[s]) : [],
      g.tv ? get('tv', g.tv, ids[s]) : []
    ]);
    return { s, list: notSeen(interleave(mv, tv)).slice(0, 40) };

  box.innerHTML = rows.map(({ s, list }) => list.length
    ? rowHTML(`${g.label} en ${SERVICES[s].name}`, list.map(r => cardHTML(r, s)).join(''), s)
    : `<div class="msg">No encontré ${esc(g.label.toLowerCase())} en ${SERVICES[s].name}.</div>`).join('');
}

// Busca por nombre revisando hasta 5 páginas de películas y 5 de series (200 títulos),
// y va mostrando los que están en tus plataformas a medida que los confirma.
async function titleSearch(q, seq, hasGenre) {
  const res = $('titleRes'), head = $('titleH');
  const seen = new Set();
  let found = 0, firstRaw = null;

  const addPage = async (type, page) => {
    const d = await api('search/' + type, { query: q, include_adult: 'false', page });
    const list = d.results.map(r => ({ ...r, _type: type }));
    if (!firstRaw && list.length) firstRaw = list[0];
    const mine = await onlyMine(list);
    if (seq !== searchSeq) return d.total_pages;
    const fresh = mine.filter(r => !seen.has(type + '/' + r.id));
    fresh.forEach(r => seen.add(type + '/' + r.id));
    if (fresh.length) {
      res.insertAdjacentHTML('beforeend', fresh.map(r => cardHTML(r)).join(''));
      fillBadges(res);
      found += fresh.length;
      head.textContent = `Títulos con "${q}" en el nombre en tus plataformas (${found})`;
    }
    return d.total_pages;
  };

  const [tm, tt] = await Promise.all([addPage('movie', 1), addPage('tv', 1)]);
  const more = [];
  for (let p = 2; p <= Math.min(5, tm); p++) more.push(addPage('movie', p));
  for (let p = 2; p <= Math.min(5, tt); p++) more.push(addPage('tv', p));
  await Promise.all(more);
  if (seq !== searchSeq) return;

  if (!found) {
    if (hasGenre) { $('titleSec').remove(); return; }
    let where = '';
    if (firstRaw) {
      const p = await providers(firstRaw._type, firstRaw.id);
      const name = esc(firstRaw.title || firstRaw.name);
      where = p.others.length ? `<br>"${name}" está en: <strong>${esc(p.others.join(', '))}</strong>.`
            : p.rent.length ? `<br>"${name}" solo está para alquilar o comprar en: ${esc(p.rent.slice(0, 5).join(', '))}.`
            : '';
    }
    if (seq !== searchSeq) return;
    $('titleSec').outerHTML = `<div class="msg"><strong>"${esc(q)}"</strong> no está en ${svcList('ni')} en Argentina.${where}</div>`;
  }
}

/* ===== Actores y directores =====
   Si lo que escribes es el nombre de una persona ("nicolas cage", "zendaya", "tarantino"),
   muestra todas sus películas y series que están en tus plataformas. */
async function detectPerson(q) {
  const nq = norm(q);
  if (nq.length < 4) return null;
  const d = await api('search/person', { query: q, include_adult: 'false' });
  const qWords = nq.split(' ');
  const p = (d.results || []).find(r => {
    const nameWords = norm(r.name).split(' ');
    // Cada palabra escrita tiene que ser el comienzo de una palabra del nombre ("nico cage" sirve)
    const ok = qWords.every(w => nameWords.some(n => n.startsWith(w)));
    // Con una sola palabra exige el nombre completo o el apellido, y que sea alguien conocido
    return ok && (qWords.length > 1 || ((norm(r.name) === nq || nameWords[nameWords.length - 1] === nq) && r.popularity > 3));
  });
  return p && p.popularity > 0.5 ? p : null;
}

async function personSearch(person, seq) {
  const res = $('personRes'), head = $('personT');
  const c = await api(`person/${person.id}/combined_credits`);
  const director = person.known_for_department === 'Directing';
  const NOT_FICTION = [10763, 10767, 10764]; // noticias, talk shows, realities
  const self = /\b(self|himself|herself|themselves|s[ií] mism[oa]|narrator|host)\b/i;
  const credits = (director ? (c.crew || []).filter(x => x.job === 'Director' && x.media_type === 'movie') : [])
    .concat(c.cast || [])
    .filter(x => (x.media_type === 'movie' || x.media_type === 'tv')
      && !(x.genre_ids || []).some(g => NOT_FICTION.includes(g))
      && !self.test(x.character || ''));
  const weight = x => (x.popularity || 0) * (x.media_type === 'tv' && (x.episode_count || 0) <= 2 ? 0.05 : 1);
  const seen = new Set();
  const list = credits.filter(x => { const k = x.media_type + '/' + x.id; if (seen.has(k)) return false; seen.add(k); return true; })
    // Papeles principales primero; las apariciones de 1 o 2 capítulos en series van al final
    .sort((a, b) => weight(b) - weight(a));

  const who = esc(person.name);
  const verb = director ? 'Dirigidas por o con' : 'Con';
  let found = 0;
  for (let i = 0; i < list.length; i += 20) {
    const mine = await onlyMine(list.slice(i, i + 20));
    if (seq !== searchSeq) return;
    if (mine.length) {
      res.insertAdjacentHTML('beforeend', mine.map(r => cardHTML(r)).join(''));
      fillBadges(res);
      found += mine.length;
      head.innerHTML = `${verb} ${who} en tus plataformas (${found})`;
    }
  }
  if (!found) $('personSec').outerHTML = `<div class="msg">Ninguna película o serie de <strong>${who}</strong> está ahora en ${svcList('ni')} en Argentina.</div>`;
  else head.innerHTML = `${verb} ${who} en tus plataformas (${found})`;
}

/* ===== Relacionadas =====
   Si lo que escribes es el nombre de una película o serie ("breaking bad", "titanic"),
   además de encontrarla te recomienda otras parecidas que están en tus plataformas. */
async function detectTitle(q) {
  const nq = norm(q);
  if (nq.length < 3) return null;
  const d = await api('search/multi', { query: q, include_adult: 'false' });
  const list = (d.results || []).filter(r => r.media_type === 'movie' || r.media_type === 'tv');
  // El título tiene que coincidir con lo escrito (o empezar igual, si escribiste bastante)
  const match = r => [r.title, r.name, r.original_title, r.original_name].filter(Boolean).map(norm)
    .some(t => t === nq || (nq.length >= 5 && t.startsWith(nq + ' ')) || (nq.length >= 6 && t.startsWith(nq)));
  const hits = list.filter(match).sort((a, b) => (b.popularity || 0) - (a.popularity || 0));
  return hits[0] || null;
}

async function relatedRow(t, seq) {
  const box = $('relRow');
  const type = t.media_type;
  const [rec1, rec2, sim] = await Promise.all([
    api(`${type}/${t.id}/recommendations`, { page: 1 }),
    api(`${type}/${t.id}/recommendations`, { page: 2 }).catch(() => ({ results: [] })),
    api(`${type}/${t.id}/similar`, { page: 1 }).catch(() => ({ results: [] }))
  ]);
  const seen = new Set([type + '/' + t.id]);
  const pool = [...rec1.results, ...rec2.results, ...sim.results]
    .map(r => ({ ...r, _type: r.media_type || type }))
    .filter(r => /[a-záéíóúñü]/i.test(r.title || r.name || ''))
    .filter(r => { const k = typeOf(r) + '/' + r.id; if (seen.has(k)) return false; seen.add(k); return true; });
  const list = notSeen(await onlyMine(pool)).slice(0, 30);
  if (seq !== searchSeq) return;
  const name = t.title || t.name;
  box.innerHTML = list.length
    ? rowHTML(`💡 Si te gusta "${name}", también te pueden gustar`, list.map(r => cardHTML(r)).join(''))
    : `<div class="msg">No encontré títulos parecidos a "${esc(name)}" en tus plataformas.</div>`;
  fillBadges(box);
}

async function runSearch() {
  const q = $('q').value.trim();
  if (!apiKey) return;
  if (!q) { loadTrending(); return; }
  const seq = ++searchSeq;
  exploreLoaded = false;
  $('filters').classList.remove('off');
  content.innerHTML = '<div class="msg">Buscando…</div>';
  let [g, person, title] = await Promise.all([
    detectGenre(q).catch(() => null),
    detectPerson(q).catch(() => null),
    detectTitle(q).catch(() => null)
  ]);
  if (seq !== searchSeq) return;
  // Un nombre de persona gana sobre una palabra clave suelta ("tarantino"); un tema conocido de una palabra gana sobre una persona ("amor")
  if (person && g && !g.fromList) g = null;
  if (person && g && g.fromList && norm(q).split(' ').length === 1) person = null;
  // Si es un tema o una persona, no se buscan "parecidas" a un título que por casualidad se llame igual
  if (g && g.fromList || person) title = null;
  // Un título conocido gana sobre una palabra clave suelta con el mismo nombre ("breaking bad")
  if (title && g && !g.fromList) g = null;
  const face = person && person.profile_path ? `<img class="face" src="${IMG}w185${person.profile_path}" alt="">` : '';
  content.innerHTML =
    (person ? `<section class="row" id="personSec"><h2>${face}<span id="personT">Buscando películas y series de ${esc(person.name)}…</span></h2><div class="results" id="personRes"></div></section>` : '') +
    (g ? `<div id="genreRows"><div class="msg">Buscando ${esc(g.label.toLowerCase())} en ${svcList()}…</div></div>` : '') +
    `<section class="row" id="titleSec"><h2 id="titleH">Buscando títulos con "${esc(q)}"…</h2><div class="results" id="titleRes"></div></section>`
    + (title ? `<div id="relRow"><div class="msg">Buscando títulos parecidos a "${esc(title.title || title.name)}"…</div></div>` : '');
  try {
    await Promise.all([
      person ? personSearch(person, seq) : null,
      g ? genreRows(g, seq) : null,
      title ? relatedRow(title, seq) : null,
      titleSearch(q, seq, !!g || !!person)
    ]);
  } catch (e) {
    if (seq === searchSeq) content.innerHTML = `<div class="msg">No se pudo buscar. Revisa tu conexión a internet.<br><small>(${esc(e.message)})</small></div>`;
  }
}

const filters = { svc: 'all', type: 'all', min: '0', sort: 'rel', age: 'all' };
$('filters').addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  const group = chip.closest('.fgroup');
  group.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === chip));
  filters[group.dataset.f] = chip.dataset.v;
  applyFilters();
});

function applyFilters() {
  if (content.querySelector('.picker')) return;
  const min = parseInt(filters.min, 10) * 10;
  content.querySelectorAll('.card').forEach(c => {
    const svcs = (c.dataset.svcs || '').split(' ');
    const r = parseInt(c.dataset.r, 10) || 0;
    const y = parseInt(c.dataset.y, 10) || 0;
    const ok = (filters.svc === 'all' || svcs.includes(filters.svc))
      && (filters.type === 'all' || c.dataset.t === filters.type)
      && (!min || r >= min)
      && (filters.age === 'all' || (filters.age === 'kids') === isKids(c));
    c.style.display = ok ? '' : 'none';
    const w = parseInt(c.dataset.w, 10) || 0;
    c.style.order = filters.sort === 'rating' ? -w : filters.sort === 'new' ? -y : filters.sort === 'old' ? (y || 9999) : 0;
  });
  // Oculta las filas que quedaron sin títulos
  content.querySelectorAll('.row').forEach(row => {
    const cards = row.querySelectorAll('.card');
    if (!cards.length) { row.style.display = ''; return; }
    row.style.display = [...cards].some(c => c.style.display !== 'none') ? '' : 'none';
    const strip = row.querySelector('.strip');
    if (strip && filters.sort !== 'rel') strip.scrollLeft = 0;
  });
}
// Se vuelven a aplicar solos cada vez que llegan resultados nuevos
let filterFrame = 0;
new MutationObserver(() => {
  cancelAnimationFrame(filterFrame);
  filterFrame = requestAnimationFrame(applyFilters);
}).observe(content, { childList: true, subtree: true });

// "Para chicos": familia, infantil o animación, sin terror, crimen, suspenso ni guerra (el anime japonés queda afuera)
function isKids(c) {
  const g = (c.dataset.g || '').split(' ').map(Number);
  // En series, la animación sola no alcanza (Rick y Morty, Los Simpson): tiene que estar marcada como infantil o familiar
  const kidsGenre = g.includes(10751) || g.includes(10762) || (g.includes(16) && c.dataset.t === 'movie' && c.dataset.l !== 'ja');
  const adult = [27, 80, 53, 10752, 10768].some(x => g.includes(x));
  return kidsGenre && !adult;
}

/* ================= 🔔 Novedades de las series que seguís ================= */
const DAY = 864e5;
const fmtDate = s => new Date(s + 'T12:00').toLocaleDateString(LANG, { day: 'numeric', month: 'short' });
function relDay(s) {
  const d = Math.round((new Date(s + 'T12:00') - new Date()) / DAY);
  return d === 0 ? 'hoy' : d === 1 ? 'mañana' : d === -1 ? 'ayer' : d < 0 ? `hace ${-d} días` : `en ${d} días`;
}
async function loadNewEpisodes(seq) {
  const box = $('newEpsRow');
  if (!box || !follows.length) return;
  const today = new Date().toISOString().slice(0, 10);
  const rows = await Promise.all(follows.slice(0, 40).map(f =>
    limited(() => api(`tv/${f.id}`, {}, true, 6 * HOUR)).catch(() => null)));
  if (seq !== searchSeq || !$('newEpsRow')) return;
  const out = [];
  rows.forEach(d => {
    if (!d) return;
    const last = d.last_episode_to_air, next = d.next_episode_to_air, pr = progress[d.id];
    const item = { id: d.id, name: d.name, poster_path: d.poster_path, first_air_date: d.first_air_date, vote_average: d.vote_average, vote_count: d.vote_count, genre_ids: (d.genres || []).map(g => g.id), original_language: d.original_language, overview: d.overview, _type: 'tv' };
    let caption = '', rank = 0;
    if (last && last.air_date && (Date.now() - new Date(last.air_date + 'T12:00')) / DAY <= 21) { caption = `🆕 T${last.season_number} E${last.episode_number} · ${relDay(last.air_date)}`; rank = 3e9 + new Date(last.air_date).getTime() / 1e3; }
    else if (pr && last && (last.season_number > pr.s || (last.season_number === pr.s && last.episode_number > pr.e))) { caption = `▶ Te toca: T${pr.s} E${pr.e + 1}`; rank = 2e9 + (pr.at || 0) / 1e3; }
    else if (next && next.air_date && next.air_date >= today && (new Date(next.air_date) - Date.now()) / DAY <= 60) { caption = `📅 T${next.season_number} E${next.episode_number} · ${fmtDate(next.air_date)}`; rank = 1e9 - new Date(next.air_date).getTime() / 1e3; }
    if (caption) out.push({ item, caption, rank });
  });
  out.sort((a, b) => b.rank - a.rank);
  box.innerHTML = out.length ? rowHTML(`🔔 Novedades de tus series (${out.length})`, out.map(o => cardHTML(o.item, null, o.caption)).join('')) : '';
  fillBadges(box);
}

let forYouStale = true;
async function loadForYou(seq) {
  const box = $('forYouRows');
  if (!box) return;
  const liked = seenList.filter(x => x.like === 1);
  const disliked = seenList.filter(x => x.like === -1).slice(0, 6);
  const neutral = seenList.filter(x => !x.like);
  // Semillas: primero lo que te gustó, después tu lista y lo que viste sin calificar
  const seeds = [...liked.map(x => [x, 3]), ...myList.map(x => [x, 2]), ...neutral.map(x => [x, 1])]
    .filter(([x], i, a) => a.findIndex(([y]) => keyOf(y) === keyOf(x)) === i).slice(0, 10);
  if (!seeds.length) return;
  const recsOf = x => limited(() => api(`${x.media_type}/${x.id}/recommendations`)).then(d => d.results.map(r => ({ ...r, _type: r.media_type || x.media_type }))).catch(() => []);
  const [seedRecs, badRecs] = await Promise.all([
    Promise.all(seeds.map(([x]) => recsOf(x))),
    Promise.all(disliked.map(recsOf))
  ]);
  const score = new Map();
  seeds.forEach(([x, w], i) => seedRecs[i].forEach((r, pos) => {
    const k = typeOf(r) + '/' + r.id;
    const e = score.get(k) || { r, s: 0, from: [] };
    e.s += w * (1 - pos / 40);
    if (e.from.length < 2) e.from.push(x.title);
    score.set(k, e);
  }));
  badRecs.flat().forEach(r => { const e = score.get(typeOf(r) + '/' + r.id); if (e) e.s -= 2.5; });
  const ranked = [...score.values()]
    .filter(e => e.s > 0 && !inList(typeOf(e.r) + '/' + e.r.id) && /[a-záéíóúñü]/i.test(e.r.title || e.r.name || ''))
    .sort((a, b) => b.s - a.s || (b.r.popularity || 0) - (a.r.popularity || 0));
  const pool = notSeen(ranked.map(e => e.r)).slice(0, 70);
  const mine = (await onlyMine(pool)).slice(0, 30);
  // Dos filas "Porque te gustó…" con las semillas mejor calificadas
  const because = await Promise.all(seeds.filter(([, w]) => w >= 1).slice(0, 2).map(async ([x], i) => {
    const list = notSeen(seedRecs[seeds.findIndex(([y]) => y === x)]).filter(r => /[a-záéíóúñü]/i.test(r.title || r.name || ''));
    return { x, list: (await onlyMine(list)).slice(0, 20) };
  }));
  if (seq !== searchSeq || !$('forYouRows')) return;
  const who = currentProfile();
  let html = mine.length ? rowHTML(`✨ Para vos, ${who.name}`, mine.map(r => cardHTML(r)).join('')) : '';
  because.forEach(({ x, list }) => {
    if (list.length) html += rowHTML(`${x.like === 1 ? '👍 Porque te gustó' : x.like === undefined ? '📌 Porque agregaste' : '👁 Porque viste'} "${x.title}"`, list.map(r => cardHTML(r)).join(''));
  });
  box.innerHTML = html;
  fillBadges(box);
  forYouStale = false;
}

async function renderStats(seq) {
  const box = $('statsBox');
  const movies = seenList.filter(x => x.media_type === 'movie');
  const series = seenList.filter(x => x.media_type === 'tv');
  // Duración de las películas vistas (se busca la que falte; queda en memoria 24 h)
  const runtimes = await Promise.all(movies.slice(0, 150).map(x => x.runtime ? x.runtime
    : limited(() => api(`movie/${x.id}`)).then(d => d.runtime || 0).catch(() => 0)));
  const minutes = runtimes.reduce((a, b) => a + b, 0);
  const [gm, gt] = await Promise.all([api('genre/movie/list').catch(() => ({ genres: [] })), api('genre/tv/list').catch(() => ({ genres: [] }))]);
  const gname = new Map([...gm.genres, ...gt.genres].map(g => [g.id, g.name]));
  const gcount = new Map();
  seenList.forEach(x => (x.genre_ids || []).forEach(g => { const n = gname.get(g); if (n) gcount.set(n, (gcount.get(n) || 0) + (x.like === 1 ? 2 : x.like === -1 ? 0 : 1)); }));
  // Actores que más aparecen en lo que viste
  const credits = await Promise.all(seenList.slice(0, 50).map(x =>
    limited(() => api(`${x.media_type}/${x.id}/${x.media_type === 'tv' ? 'aggregate_credits' : 'credits'}`)).then(d => (d.cast || []).slice(0, 8)).catch(() => [])));
  const acount = new Map();
  credits.flat().forEach(c => acount.set(c.name, (acount.get(c.name) || 0) + 1));
  if (seq !== searchSeq || !$('statsBox')) return;

  const bars = (map, n) => {
    const top = [...map.entries()].filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]).slice(0, n);
    const max = top.length ? top[0][1] : 1;
    return top.length ? `<div class="bars">${top.map(([k, v]) => `<div class="bar"><span>${esc(k)}</span><i style="width:${Math.max(4, v / max * 100)}%"></i><em>${v}</em></div>`).join('')}</div>` : '<div class="msg" style="padding:1vh 0">Todavía no hay datos.</div>';
  };
  const h = Math.floor(minutes / 60);
  box.innerHTML = seenList.length ? `
    <div class="stats">
      <div class="stat"><b>${movies.length}</b><span>películas vistas</span></div>
      <div class="stat"><b>${series.length}</b><span>series vistas</span></div>
      <div class="stat"><b>${h} h</b><span>de películas (${Math.round(h / 24 * 10) / 10} días)</span></div>
      <div class="stat"><b>${seenList.filter(x => x.like === 1).length} 👍 · ${seenList.filter(x => x.like === -1).length} 👎</b><span>calificadas</span></div>
      <div class="stat"><b>${myList.length}</b><span>en tu lista</span></div>
      <div class="stat"><b>${follows.length}</b><span>series que seguís</span></div>
    </div>
    <h4 style="margin:3vh 0 1.4vh">🎭 Tus géneros favoritos</h4>${bars(gcount, 8)}
    <h4 style="margin:3vh 0 1.4vh">⭐ Los actores que más viste</h4>${bars(new Map([...acount].filter(([, v]) => v > 1)), 10)}`
    : '<div class="msg" style="padding:1vh 0">Todavía no marcaste nada como visto. Abrí cualquier título y tocá <strong>👁 Ya la vi</strong> o <strong>👍</strong>: así aparecen tus estadísticas y mejora "Para vos".</div>';
}

/* ================= 🔄 Sincronización PC ↔ celular =================
   Los datos se guardan en un "cajón" JSON en internet (jsonblob.com, sin cuentas). Solo lo encuentra
   quien tiene el enlace del celular o el código QR. La clave de TMDB no se guarda ahí.
   Gana el último cambio: al abrir el centro (o volver a él) se baja lo más nuevo; al cambiar algo, se sube. */
const SYNC_PROVIDERS = {
  jsonblob: {
    async create(data) {
      const r = await fetch('https://jsonblob.com/api/jsonBlob', { method: 'POST', headers: { 'content-type': 'application/json', accept: 'application/json' }, body: JSON.stringify(data) });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const id = r.headers.get('x-jsonblob-id') || (r.headers.get('location') || '').split('/').pop();
      if (!id) throw new Error('sin identificador');
      return { p: 'jsonblob', id };
    },
    url: c => 'https://jsonblob.com/api/jsonBlob/' + encodeURIComponent(c.id),
    headers: () => ({ 'content-type': 'application/json', accept: 'application/json' })
  },
  extendsclass: {
    async create(data) {
      const key = crypto.getRandomValues(new Uint32Array(4)).join('');
      const r = await fetch('https://json.extendsclass.com/bin', { method: 'POST', headers: { 'content-type': 'application/json', 'Security-key': key, Private: 'true' }, body: JSON.stringify(data) });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const j = await r.json();
      if (!j.id) throw new Error('sin identificador');
      return { p: 'extendsclass', id: j.id, key };
    },
    url: c => 'https://json.extendsclass.com/bin/' + encodeURIComponent(c.id),
    headers: c => ({ 'content-type': 'application/json', 'Security-key': c.key || '' })
  }
};
function syncCfg() { try { const c = JSON.parse(localStorage.getItem('cm-sync')); return c && c.id && SYNC_PROVIDERS[c.p] ? c : null; } catch (e) { return null; } }
function syncSaveCfg(c) { try { localStorage.setItem('cm-sync', JSON.stringify(c)); } catch (e) {} }
async function syncEnable() {
  const now = Date.now();
  localStorage.setItem('cm-sync-at', String(now));
  const data = { ...backupData(), at: now };
  let lastErr;
  for (const name of Object.keys(SYNC_PROVIDERS)) {
    try {
      const c = await SYNC_PROVIDERS[name].create(data);
      c.last = Date.now();
      syncSaveCfg(c);
      localStorage.removeItem('cm-sync-dirty');
      syncReady = true;
      return c;
    } catch (e) { lastErr = e; }
  }
  throw lastErr || new Error('sin servicio');
}
// syncReady: hasta la primera consulta al abrir, los cambios no se suben (así un equipo nuevo no pisa los datos del otro)
var syncTimer = null, syncBusy = false, syncReady = false;
// Se llama cada vez que cambia algo sincronizable: se sube a los pocos segundos
function syncChanged() {
  if (!syncReady || !syncCfg()) return;
  try { localStorage.setItem('cm-sync-at', String(Date.now())); localStorage.setItem('cm-sync-dirty', '1'); } catch (e) {}
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => syncRun(), 2500);
}
// Sube lo pendiente o baja lo más nuevo. Devuelve true si pudo hablar con la sincronización.
async function syncRun(force) {
  const c = syncCfg();
  if (!c || syncBusy || (!navigator.onLine && !force)) return false;
  syncBusy = true;
  try {
    const prov = SYNC_PROVIDERS[c.p];
    const localAt = Number(localStorage.getItem('cm-sync-at')) || 0;
    const remote = await fetch(prov.url(c), { headers: prov.headers(c), cache: 'no-store' }).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
    const remoteAt = Number(remote && remote.at) || 0;
    if (remoteAt > localAt) {
      // Hay algo más nuevo en el otro equipo: se trae
      applyBackup(remote, true);
      localStorage.setItem('cm-sync-at', String(remoteAt));
      localStorage.removeItem('cm-sync-dirty');
      afterSyncPull();
    } else if (localStorage.getItem('cm-sync-dirty') === '1' || remoteAt < localAt) {
      const r = await fetch(prov.url(c), { method: 'PUT', headers: prov.headers(c), body: JSON.stringify({ ...backupData(), at: localAt || Date.now() }) });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      localStorage.removeItem('cm-sync-dirty');
    }
    syncSaveCfg({ ...c, last: Date.now() });
    syncReady = true;
    return true;
  } catch (e) {
    // Sin internet: si este equipo ya se sincronizó alguna vez, los cambios quedan pendientes para subir después
    if (Number(localStorage.getItem('cm-sync-at')) > 0) syncReady = true;
    return false;
  }
  finally { syncBusy = false; }
}

  const nq = norm(q);

    .filter(l => norm(l).split(' ').some(w => w.startsWith(nq)) || norm(l).startsWith(nq)).slice(0, 3);
  let res = [];
  try { res = ((await api('search/multi', { query: q, include_adult: 'false' })).results || []).filter(r => r.media_type !== 'person' || (r.profile_path && r.popularity > 2)).slice(0, 7); } catch (e) {}
  if (seq !== sugSeq || document.activeElement && !['q'].includes(document.activeElement.id) && !sugBox.contains(document.activeElement)) return;
  const items = cats.map(c => `<button class="sug focusable" data-q="${esc(c)}"><span class="si">📂</span>${esc(c)} <small>· categoría</small></button>`)

async function suggest() {
  const seq = ++searchSeq;
  const res = $('pickRes');
  res.innerHTML = '<div class="msg">Buscando algo para vos…</div>';
  try {
    const ids = await serviceIds();
    const svcs = picker.svc === 'all' ? PREMIUM : [picker.svc];
    const prov = [...new Set(svcs.flatMap(s => [...(ids[s] || [])]))].join('|');
    const mood = MOODS[picker.mood];
    const types = picker.type === 'any' ? ['movie', 'tv'] : [picker.type];
    const lists = await Promise.all(types.map(async type => {
      const params = {
        ...mood[type],
        watch_region: REGION, with_watch_providers: prov, with_watch_monetization_types: 'flatrate',
        sort_by: 'popularity.desc',
        'vote_average.gte': type === 'movie' ? 6.6 : 7,
        'vote_count.gte': type === 'movie' ? 300 : 120
      };
      if (type === 'tv') params.without_genres = '10767,10763,10764';
      if (type === 'movie' && picker.dur === 'short') params['with_runtime.lte'] = 95;
      if (type === 'movie' && picker.dur === 'mid') params['with_runtime.lte'] = 120;
      if (type === 'tv' && picker.dur === 'short') params.with_type = 2; // miniseries
      // Página al azar entre las más populares, para que cada vez sugiera algo distinto
      const first = await api('discover/' + type, { ...params, page: 1 });
      const page = 1 + Math.floor(Math.random() * Math.min(first.total_pages || 1, 6));
      const d = page === 1 ? first : await api('discover/' + type, { ...params, page });
      return d.results.map(r => ({ ...r, _type: type }));
    }));
    if (seq !== searchSeq) return;
    const pool = notSeen(interleave(...(lists.length > 1 ? lists : [lists[0], []])));
    for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
    if (!pool.length) { res.innerHTML = '<div class="msg">No encontré nada con esas opciones. Prueba con "Sin límite" o "Todas".</div>'; return; }
    const [top, ...rest] = pool;
    cardHTML(top); // registra el título para poder abrir su ficha
    const k = keyOf(top);
    const img = top.backdrop_path ? `${IMG}w780${top.backdrop_path}` : top.poster_path ? `${IMG}w500${top.poster_path}` : '';
    const year = (top.release_date || top.first_air_date || '').slice(0, 4);
    res.innerHTML = `
      <button class="pick focusable" data-key="${k}">
        ${img ? `<img src="${img}" alt="">` : ''}
        <div class="pi">
          <div class="meta">✨ Mi sugerencia para hoy</div>
          <div class="pt">${esc(top.title || top.name)}</div>
          <div class="meta">${[top._type === 'tv' ? 'Serie' : 'Película', year, top.vote_average ? '★ ' + top.vote_average.toFixed(1) : ''].filter(Boolean).join(' · ')}</div>
          <div class="po">${esc(top.overview || '')}</div>
          <div class="meta">Enter para ver la ficha y dónde verla</div>
        </div>
      </button>
      <div class="pgroup" style="padding:2vh 4vw 0"><button class="btn focusable" id="again">🎲 Otra sugerencia</button></div>
      ${rest.length ? rowHTML('Otras opciones', rest.slice(0, 15).map(r => cardHTML(r)).join('')) : ''}`;
    fillBadges(res);
    res.querySelector('.pick').addEventListener('click', () => openDetail(k));
    $('again').addEventListener('click', suggest);
    res.querySelector('.pick').focus();
    res.querySelector('.pick').scrollIntoView({ block: 'start', behavior: 'smooth' });
  } catch (e) {
    if (seq === searchSeq) res.innerHTML = `<div class="msg">No se pudo buscar una sugerencia. Revisa tu conexión.<br><small>(${esc(e.message)})</small></div>`;
  }
}

/* ===== Enlaces exactos (JustWatch) =====
   En la PC los trae el ayudante (ayudante.ps1), que escucha solo en esta PC.
   En el celular (o si el ayudante está apagado) se le pregunta a JustWatch directamente. */
const HELPER = 'http://localhost:47615';
const JW_QUERY = 'query T($country: Country!, $language: Language!, $first: Int!, $filter: TitleFilter) { popularTitles(country: $country, first: $first, filter: $filter) { edges { node { objectType content(country: $country, language: $language) { title externalIds { tmdbId } } offers(country: $country, platform: WEB) { monetizationType standardWebURL package { clearName technicalName } } } } } }';
function fetchTimeout(url, opts = {}, ms = 9000) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), ms);
  return fetch(url, { ...opts, signal: ctrl.signal }).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .finally(() => clearTimeout(timer));
}
async function justWatchOffers(it, title) {
  const body = { query: JW_QUERY, variables: { country: REGION, language: 'es', first: 10, filter: { searchQuery: title } } };
  const r = await fetchTimeout('https://apis.justwatch.com/graphql', {
    method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body)
  });
  const objType = it.media_type === 'tv' ? 'SHOW' : 'MOVIE';
  const node = ((r.data && r.data.popularTitles && r.data.popularTitles.edges) || []).map(e => e.node)
    .find(n => n.objectType === objType && String(n.content && n.content.externalIds && n.content.externalIds.tmdbId) === String(it.id));
  if (!node) return [];
  return (node.offers || []).filter(o => ['FLATRATE', 'FREE', 'ADS'].includes(o.monetizationType))
    .map(o => ({ name: o.package.clearName, url: o.standardWebURL }));
}
/* Wikidata guarda el código de cada título en Netflix, Disney+, HBO Max, Prime Video, Apple TV…
   y el formato de su dirección. Funciona desde cualquier navegador (también el del celular). */
const WD_HOSTS = { netflix: /netflix\.com/, disney: /disneyplus\.com/, max: /(hbo)?max\.com/, prime: /primevideo\.com|amazon\./,
  apple: /tv\.apple\.com/, paramount: /paramountplus\.com/, crunchyroll: /crunchyroll\.com/, mubi: /mubi\.com/ };
async function wikidataLinks(it) {
  const prop = it.media_type === 'tv' ? 'P4983' : 'P4947'; // código de TMDB (serie / película)
  const q = `SELECT ?val ?fmt WHERE { ?item wdt:${prop} "${Number(it.id)}" . ?item ?claim ?val .
    ?p wikibase:directClaim ?claim ; wikibase:propertyType wikibase:ExternalId ; wdt:P1630 ?fmt .
    FILTER(REGEX(STR(?fmt), "netflix|disneyplus|max\\\\.com|primevideo|amazon\\\\.|tv\\\\.apple|paramountplus|crunchyroll|mubi")) }`;
  const r = await fetchTimeout('https://query.wikidata.org/sparql?format=json&query=' + encodeURIComponent(q), { headers: { accept: 'application/sparql-results+json' } });
  const links = {};
  for (const row of (r.results && r.results.bindings) || []) {
    const fmt = row.fmt.value, val = row.val.value;
    const s = Object.keys(WD_HOSTS).find(k => WD_HOSTS[k].test(fmt));
    if (s && !links[s] && fmt.includes('$1')) links[s] = fmt.replace('$1', encodeURIComponent(val));
  }
  return links;
}
// Enlace exacto al título en cada plataforma: { netflix: 'https://www.netflix.com/title/…', … }
async function directLinks(it, d) {
  const key = 'c:links:' + keyOf(it);
  const hit = cacheGet(key);
  if (hit) return hit.d;
  const title = it.title || it.name || (d && (d.title || d.name));
  const otitle = d ? (d.original_title || d.original_name) : '';
  if (!title) return null;
  const toLinks = offers => {
    const links = {};
    for (const o of offers || []) {
      const s = Object.keys(SERVICES).find(k => SERVICES[k].match(o.name));
      if (s && !links[s] && o.url) links[s] = o.url;
    }
    return links;
  };
  // JustWatch: primero el ayudante de la PC (en el celular no existe); si no, directo desde el navegador
  const jw = (async () => {
    if (!IS_TOUCH) {
      try {
        const url = `${HELPER}/link?tmdb=${it.id}&type=${it.media_type}&title=${encodeURIComponent(title)}&otitle=${encodeURIComponent(otitle || '')}`;
        return toLinks((await fetchTimeout(url)).offers);
      } catch (e) {}
    }
    let offers = await justWatchOffers(it, title);
    if (!offers.length && otitle && otitle !== title) offers = await justWatchOffers(it, otitle);
    return toLinks(offers);
  })();
  // Se consultan las dos fuentes a la vez; JustWatch manda si las dos tienen enlace
  const [a, b] = await Promise.allSettled([jw, wikidataLinks(it)]);
  if (a.status === 'rejected' && b.status === 'rejected') return null; // sin conexión: se reintenta la próxima vez
  const links = { ...(b.value || {}), ...(a.value || {}) };
  cacheSet(key, links, Object.keys(links).length ? 24 * HOUR : HOUR); // si no encontró nada, reintenta en 1 h
  return links;
}
